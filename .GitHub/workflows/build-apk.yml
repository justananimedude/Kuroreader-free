name: Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/kuroreader/free
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.4'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
            }
          }
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF
          
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
            namespace 'com.kuroreader.free'
            compileSdk 34
            defaultConfig { applicationId "com.kuroreader.free"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
            buildTypes { release { minifyEnabled false } debug { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="KuroReader" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          
          cat > app/src/main/java/com/kuroreader/free/MainActivity.kt <<'EOF'
          package com.kuroreader.free
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.compose.material3.Text
          import androidx.activity.compose.setContent
          class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              setContent { Text("KuroReader OK") }
            }
          }
          EOF
          
      - name: Make gradlew
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KuroReader-APK
          path: app/build/outputs/apk/debug/*.apk
