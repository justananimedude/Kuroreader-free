name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/kuroreader/free/source
          mkdir -p app/src/main
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat > build.gradle <<'ENDOFFILE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.4'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
            }
          }
          ENDOFFILE
          cat > app/build.gradle <<'ENDOFFILE'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
            namespace 'com.kuroreader.free'; compileSdk 34
            defaultConfig { applicationId "com.kuroreader.free"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
            buildTypes { debug { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
            kotlinOptions { jvmTarget = '1.8' }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.4' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.compose.ui:ui:1.5.4'
            implementation 'androidx.compose.material3:material3:1.1.2'
            implementation 'androidx.activity:activity-compose:1.8.2'
          }
          ENDOFFILE
          cat > app/src/main/AndroidManifest.xml <
